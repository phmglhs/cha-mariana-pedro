<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F5F0"/>
      <stop offset="100%" stop-color="#EFE8DF"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#B98470" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#dots)"/>
  <rect x="28" y="28" width="584" height="424" fill="none" stroke="#B39A84" stroke-width="1.2" opacity="0.55"/>
  <rect x="36" y="36" width="568" height="408" fill="none" stroke="#B98470" stroke-width="0.6" opacity="0.35"/>
  <g transform="translate(320 250)" fill="none" stroke="#8A4F3D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="155" rx="130" ry="12" fill="#E8DDD3" stroke="none" opacity="0.7"/>

    <!-- water tank at back -->
    <rect x="-20" y="-150" width="86" height="70" rx="12" fill="#E8DDD3"/>
    <path d="M-6 -136 h58 v40 h-58 z" fill="#F4EEE7" stroke="#B39A84" stroke-width="3" opacity="0.85"/>

    <!-- machine body -->
    <path d="M-95 -88 h200 v200 h-200 z" rx="16" fill="#F3EDE5"/>
    <rect x="-95" y="-88" width="200" height="200" rx="18" fill="#F3EDE5"/>

    <!-- front face recess -->
    <rect x="-70" y="-50" width="150" height="90" rx="12" fill="#E8DDD3"/>

    <!-- capsule lever / brew head -->
    <rect x="-48" y="-88" width="106" height="28" rx="8" fill="#B98470"/>
    <path d="M-18 -116 h46 l8 28 h-62 z" fill="#4A2F26"/>
    <circle cx="5" cy="-108" r="6" fill="#B39A84" stroke="#8A4F3D"/>

    <!-- spout -->
    <path d="M-8 -8 v22" stroke-width="6"/>
    <path d="M-20 14 h24" stroke-width="4"/>

    <!-- drip tray -->
    <rect x="-70" y="70" width="150" height="22" rx="6" fill="#4A2F26"/>
    <path d="M-52 81 h114" stroke="#B39A84" stroke-width="3" opacity="0.5"/>

    <!-- cup -->
    <path d="M-28 14 h48 l6 48 h-60 z" fill="#F4EEE7"/>
    <path d="M20 28 q18 4 18 22 q0 16 -18 20" />
    <path d="M-18 36 h32" stroke="#B98470" stroke-width="3" opacity="0.45"/>

    <!-- body button -->
    <circle cx="72" cy="-20" r="8" fill="#B98470" stroke="#8A4F3D"/>

    <!-- capsule pod to the side -->
    <g transform="translate(-150 70)">
      <ellipse cx="0" cy="8" rx="22" ry="10" fill="#4A2F26"/>
      <path d="M-18 8 q0 -28 18 -36 q18 8 18 36" fill="#B98470"/>
      <ellipse cx="0" cy="-24" rx="14" ry="6" fill="#E8DDD3" stroke="#8A4F3D"/>
    </g>
  </g>
</svg>
