<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F5F0"/>
      <stop offset="100%" stop-color="#EFE8DF"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#B98470" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#dots)"/>
  <rect x="28" y="28" width="584" height="424" fill="none" stroke="#B39A84" stroke-width="1.2" opacity="0.55"/>
  <rect x="36" y="36" width="568" height="408" fill="none" stroke="#B98470" stroke-width="0.6" opacity="0.35"/>
  <g transform="translate(320 248)" fill="none" stroke="#8A4F3D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="155" rx="150" ry="12" fill="#E8DDD3" stroke="none" opacity="0.7"/>

    <!-- bottle -->
    <g transform="translate(-50 10)">
      <path d="M-28 20 h56 l6 90 h-68 z" fill="#4A2F26"/>
      <path d="M-16 20 h32 v-50 h-32 z" fill="#5B3C31"/>
      <rect x="-10" y="-50" width="20" height="28" rx="3" fill="#B39A84"/>
      <ellipse cx="0" cy="-50" rx="10" ry="6" fill="#B98470" stroke="#8A4F3D" stroke-width="3"/>
    </g>
    <!-- corkscrew -->
    <g transform="translate(70 -20) rotate(18)">
      <rect x="-10" y="-80" width="20" height="50" rx="6" fill="#4A2F26"/>
      <path d="M0 -30 q14 14 0 28 q-14 14 0 28 q14 14 0 24" stroke-width="5"/>
    </g>
    <!-- stopper -->
    <g transform="translate(90 80)">
      <rect x="-12" y="-8" width="24" height="36" rx="5" fill="#B39A84"/>
      <circle cx="0" cy="-16" r="12" fill="#E8DDD3"/>
    </g>

  </g>
</svg>
