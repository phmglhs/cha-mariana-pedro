<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F5F0"/>
      <stop offset="100%" stop-color="#EFE8DF"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#B98470" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#dots)"/>
  <rect x="28" y="28" width="584" height="424" fill="none" stroke="#B39A84" stroke-width="1.2" opacity="0.55"/>
  <rect x="36" y="36" width="568" height="408" fill="none" stroke="#B98470" stroke-width="0.6" opacity="0.35"/>
  <g transform="translate(320 248)" fill="none" stroke="#8A4F3D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="150" rx="150" ry="12" fill="#E8DDD3" stroke="none" opacity="0.7"/>

    <!-- fork -->
    <g transform="translate(-90 0)">
      <rect x="-8" y="-20" width="16" height="130" rx="6" fill="#B39A84"/>
      <path d="M-20 -20 v-100 M-7 -20 v-110 M7 -20 v-110 M20 -20 v-100" stroke-width="5"/>
      <path d="M-20 -20 h40"/>
    </g>
    <!-- knife -->
    <g transform="translate(0 0)">
      <rect x="-8" y="10" width="16" height="100" rx="6" fill="#B39A84"/>
      <path d="M-10 10 L-6 -130 L14 -120 L10 10 Z" fill="#F4EEE7"/>
    </g>
    <!-- spoon -->
    <g transform="translate(90 0)">
      <rect x="-8" y="-10" width="16" height="120" rx="6" fill="#B39A84"/>
      <ellipse cx="0" cy="-70" rx="24" ry="36" fill="#F3EDE5"/>
    </g>

  </g>
</svg>
