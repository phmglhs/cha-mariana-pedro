<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F5F0"/>
      <stop offset="100%" stop-color="#EFE8DF"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#B98470" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#dots)"/>
  <rect x="28" y="28" width="584" height="424" fill="none" stroke="#B39A84" stroke-width="1.2" opacity="0.55"/>
  <rect x="36" y="36" width="568" height="408" fill="none" stroke="#B98470" stroke-width="0.6" opacity="0.35"/>
  <g transform="translate(320 248)" fill="none" stroke="#8A4F3D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="160" rx="150" ry="12" fill="#E8DDD3" stroke="none" opacity="0.7"/>

    <rect x="-140" y="-130" width="280" height="260" rx="16" fill="#F3EDE5"/>
    <rect x="-118" y="-100" width="236" height="160" rx="10" fill="#4A2F26"/>
    <rect x="-104" y="-86" width="208" height="132" rx="8" fill="#5B3C31" stroke="none"/>
    <!-- dish rack lines -->
    <path d="M-80 -40 h160" stroke="#B39A84" stroke-width="3" opacity="0.45"/>
    <path d="M-70 -10 h140" stroke="#B39A84" stroke-width="3" opacity="0.35"/>
    <path d="M-55 20 h110" stroke="#B39A84" stroke-width="3" opacity="0.28"/>
    <!-- door handle -->
    <rect x="-40" y="70" width="80" height="16" rx="7" fill="#B39A84" stroke="#8A4F3D" stroke-width="3"/>
    <!-- top control -->
    <rect x="-100" y="-124" width="200" height="16" rx="5" fill="#E8DDD3"/>
    <circle cx="-50" cy="-116" r="5" fill="#B98470" stroke="none"/>
    <circle cx="-20" cy="-116" r="5" fill="#B98470" stroke="none"/>
    <circle cx="10" cy="-116" r="5" fill="#4A2F26" stroke="none"/>

  </g>
</svg>
