<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F5F0"/>
      <stop offset="100%" stop-color="#EFE8DF"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#B98470" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#dots)"/>
  <rect x="28" y="28" width="584" height="424" fill="none" stroke="#B39A84" stroke-width="1.2" opacity="0.55"/>
  <rect x="36" y="36" width="568" height="408" fill="none" stroke="#B98470" stroke-width="0.6" opacity="0.35"/>
  <g transform="translate(320 248)" fill="none" stroke="#8A4F3D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="160" rx="120" ry="12" fill="#E8DDD3" stroke="none" opacity="0.7"/>

    <!-- motor -->
    <rect x="-32" y="-160" width="64" height="100" rx="18" fill="#4A2F26"/>
    <rect x="-22" y="-146" width="44" height="28" rx="6" fill="#B39A84" stroke="#8A4F3D" stroke-width="3"/>
    <circle cx="0" cy="-132" r="6" fill="#B98470" stroke="none"/>
    <!-- shaft + whisk over the beaker -->
    <path d="M0 -60 v70" stroke-width="6"/>
    <ellipse cx="0" cy="28" rx="20" ry="26" fill="#F4EEE7"/>
    <path d="M-12 16 q12 24 24 0" stroke-width="3"/>
    <!-- beaker under the mixer -->
    <path d="M-48 10 h96 l14 100 h-124 z" fill="#F4EEE7" fill-opacity="0.9"/>
    <ellipse cx="0" cy="10" rx="48" ry="12" fill="#FAF7F2"/>
    <path d="M-30 40 h60" stroke="#B98470" stroke-width="3" opacity="0.4"/>

  </g>
</svg>
