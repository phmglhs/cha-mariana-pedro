<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F5F0"/>
      <stop offset="100%" stop-color="#EFE8DF"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#B98470" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#dots)"/>
  <rect x="28" y="28" width="584" height="424" fill="none" stroke="#B39A84" stroke-width="1.2" opacity="0.55"/>
  <rect x="36" y="36" width="568" height="408" fill="none" stroke="#B98470" stroke-width="0.6" opacity="0.35"/>
  <g transform="translate(320 248)" fill="none" stroke="#8A4F3D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="165" rx="120" ry="12" fill="#E8DDD3" stroke="none" opacity="0.7"/>

    <!-- wrist cuff -->
    <rect x="-42" y="80" width="84" height="48" rx="10" fill="#B39A84"/>
    <path d="M-28 96 h56 M-28 110 h56" stroke="#8A4F3D" stroke-width="3"/>
    <!-- palm + fingers as a single mitten-like glove -->
    <path d="M-46 80
             C-54 20 -52 -40 -28 -90
             C-20 -112 -8 -118 0 -118
             C10 -118 22 -112 30 -90
             C44 -70 50 10 48 80
             Z" fill="#E8DDD3"/>
    <!-- finger grooves -->
    <path d="M-16 -80 C-10 -40 -8 10 -8 70" stroke="#B98470" stroke-width="3" opacity="0.45"/>
    <path d="M8 -80 C12 -40 14 10 14 70" stroke="#B98470" stroke-width="3" opacity="0.45"/>
    <!-- thumb -->
    <path d="M-46 20 C-90 0 -96 36 -70 58 C-54 70 -42 62 -40 40" fill="#EED9CF"/>

  </g>
</svg>
